name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Bandit (SAST)
        run: bandit -c pyproject.toml -r app seed_data.py scripts
      - name: pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt
      - name: Cedar policies validate against schema
        run: python -c "from app.evaluator import load_policies; load_policies(); print('policies valid')"
      - name: Cedar policy test cases (policies/tests.json)
        run: python -m app.policy_tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pytest with coverage
        run: pytest -q --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  demo:
    # The live demo runs in the browser with Cedar's WebAssembly build instead of cedarpy.
    # Build the site and drive it under Node + Pyodide to prove the decisions still match.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build the demo site
        run: demo/build.sh _site
      - name: Smoke-test it under Pyodide + cedar-wasm
        run: |
          npm install --no-save --prefix demo pyodide@0.27.7
          node demo/smoke.mjs _site

  oidc:
    # A real IdP round trip: Keycloak with the demo realm, Aegis in oidc mode, and a headless
    # browser signing in to the dashboard with PKCE, a password and a TOTP code.
    runs-on: ubuntu-latest
    env:
      AEGIS_AUTH_MODE: oidc
      AEGIS_OIDC_ISSUER: http://localhost:8080/realms/aegis
      AEGIS_OIDC_JWKS_URL: http://localhost:8080/realms/aegis/protocol/openid-connect/certs
      AEGIS_AUDIT_KEY: ci-only-audit-key
      AEGIS_DATABASE_URL: sqlite:///./oidc.db
      AEGIS_BUSINESS_HOURS_UTC: "00-24"
      AEGIS_BUSINESS_DAYS: "0-6"
    steps:
      - uses: actions/checkout@v7
      - name: Start Keycloak with the demo realm
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 16)" \
            -v "$PWD/deploy/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.4 start-dev --import-realm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt playwright==1.63.0 && python -m playwright install --with-deps chromium
      - name: Wait for Keycloak
        run: timeout 180 bash -c 'until curl -sf localhost:8080/realms/aegis/.well-known/openid-configuration > /dev/null; do sleep 3; done'
      - name: Start Aegis in oidc mode
        run: |
          python seed_data.py --reset > /dev/null
          nohup uvicorn app.main:app --port 8001 > aegis.log 2>&1 &
          timeout 30 bash -c 'until curl -sf localhost:8001/health > /dev/null; do sleep 1; done'
      - name: Sign in through Keycloak and use the token
        run: python scripts/oidc_e2e.py
      - name: Logs
        if: failure()
        run: |
          cat aegis.log
          docker logs keycloak 2>&1 | tail -80

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t aegis-jit:ci .
      - name: Smoke test
        run: |
          docker run -d --name aegis -p 8000:8000 -e AEGIS_AUDIT_KEY=ci-key aegis-jit:ci
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
          curl -s -o /dev/null -w "%{http_code}" localhost:8000/me | grep -q 401
          docker logs aegis
