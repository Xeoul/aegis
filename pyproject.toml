[project]
name = "aegis-jit"
version = "0.7.0"
description = "Just-In-Time IAM policy engine: natural-language access requests, Cedar ABAC, approvals, and scoped AWS STS credentials."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI's Depends()/Query() in argument defaults is the framework idiom
    "RUF012", # mutable class attributes in test helpers
    "UP042",  # keep (str, Enum): SQLAlchemy and Pydantic serialise these as plain strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S603", "E501"]  # S603: subprocess runs a fixed script
"scripts/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["app", "seed_data.py"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
